<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Ocorrências - 1º Turno</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#111827',
                        bordercol: '#1f2937',
                        brandgreen: '#10b981'
                    }
                }
            }
        }
    </script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (XLSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 dark:bg-slate-950 text-gray-800 dark:text-gray-100 font-sans leading-normal tracking-normal transition-colors duration-200">

    <div class="w-full px-3 sm:px-6 py-6 space-y-6 max-w-7xl mx-auto" id="painel-conteudo">

        <!-- Barra de Filtros -->
        <div class="bg-white dark:bg-slate-900 rounded-xl shadow-md p-4 flex flex-wrap gap-4 items-center justify-between border border-gray-200 dark:border-slate-800 w-full">
            <div class="flex flex-wrap items-center gap-3">
                <span class="text-gray-700 dark:text-gray-300 font-bold text-sm"><i class="fa-solid fa-calendar-days text-emerald-500 mr-2"></i>Filtrar Período:</span>
                <input type="date" id="filtro-data-inicio" onchange="aplicarFiltroCalendario()" class="border border-gray-300 dark:border-slate-700 rounded-lg p-2 text-sm bg-gray-50 dark:bg-slate-800 text-gray-800 dark:text-gray-100">
                <input type="date" id="filtro-data-fim" onchange="aplicarFiltroCalendario()" class="border border-gray-300 dark:border-slate-700 rounded-lg p-2 text-sm bg-gray-50 dark:bg-slate-800 text-gray-800 dark:text-gray-100">
                <button onclick="limparFiltroCalendario()" class="bg-gray-200 dark:bg-slate-800 hover:bg-gray-300 text-gray-700 dark:text-gray-300 px-3 py-2 rounded-lg text-xs font-semibold">Ver Tudo</button>
            </div>
            <div id="info-filtro-ativo" class="text-xs font-semibold text-emerald-600 dark:text-emerald-400">Exibindo: Todos os dados</div>
        </div>

        <!-- 3 GRÁFICOS -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
            <div class="bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl p-4 shadow-lg">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Ocorrências mais Rotineiras</h2>
                <div class="h-52 relative flex items-center justify-center"><canvas id="chartQuant3"></canvas></div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl p-4 shadow-lg">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Evolução por Período (Dias)</h2>
                <div class="h-52 relative flex items-center justify-center"><canvas id="chartQuant2"></canvas></div>
            </div>
            <div class="bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-xl p-4 shadow-lg">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Volume por Tipo</h2>
                <div class="h-52 relative flex items-center justify-center"><canvas id="chartQuant1"></canvas></div>
            </div>
        </section>

        <!-- CARDS DE KPIs -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 w-full">
            <div class="bg-white dark:bg-slate-900 rounded-xl shadow-md p-4 border-l-4 border-emerald-500 border border-gray-200 dark:border-slate-800">
                <p class="text-gray-500 text-[11px] font-medium">Rasgadas (Sorter)</p>
                <h3 class="text-xl font-extrabold mt-1" id="kpi-sorter">0</h3>
            </div>
            <div class="bg-white dark:bg-slate-900 rounded-xl shadow-md p-4 border-l-4 border-emerald-500 border border-gray-200 dark:border-slate-800">
                <p class="text-gray-500 text-[11px] font-medium">Rasgadas (Carreg.)</p>
                <h3 class="text-xl font-extrabold mt-1" id="kpi-carregamento-rasgadas">0</h3>
            </div>
            <div class="bg-white dark:bg-slate-900 rounded-xl shadow-md p-4 border-l-4 border-emerald-500 border border-gray-200 dark:border-slate-800">
                <p class="text-gray-500 text-[11px] font-medium">Faltas Carreg.</p>
                <h3 class="text-xl font-extrabold mt-1" id="kpi-faltas">0</h3>
            </div>
            <div class="bg-white dark:bg-slate-900 rounded-xl shadow-md p-4 border-l-4 border-orange-500 border border-gray-200 dark:border-slate-800">
                <p class="text-gray-500 text-[11px] font-medium">Requisitadas</p>
                <h3 class="text-xl font-extrabold text-orange-500 mt-1" id="kpi-requisitadas">0</h3>
            </div>
            <div class="bg-white dark:bg-slate-900 rounded-xl shadow-md p-4 border-l-4 border-emerald-500 border border-gray-200 dark:border-slate-800">
                <p class="text-gray-500 text-[11px] font-medium">Faltas no App</p>
                <h3 class="text-xl font-extrabold text-emerald-600 mt-1" id="kpi-faltas-no-app">0</h3>
            </div>
            <div class="bg-white dark:bg-slate-900 rounded-xl shadow-md p-4 border-l-4 border-emerald-500 border border-gray-200 dark:border-slate-800">
                <p class="text-gray-500 text-[11px] font-medium">Total Ocorrências</p>
                <h3 class="text-xl font-extrabold text-emerald-600 mt-1" id="kpi-total">0</h3>
            </div>
        </div>

    </div>

    <!-- SCRIPT DE CONTAGEM DIRETA -->
    <script>
        const SUPABASE_URL = 'https://dylwhnsxjbeiukdmcupq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_uZL-3Z0_a-X-ZjMhwRXC9w_RP8c754J';

        let supabaseClient = null;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error("Erro ao instanciar Supabase:", e);
        }

        let chartQuant1, chartQuant2, chartQuant3;

        async function carregarDadosDiretos() {
            if (!supabaseClient) return;
            try {
                // Busca direto da tabela de controle de carregamento onde os dados reais estão sendo salvos
                const { data: itens, error } = await supabaseClient
                    .from('controle_faltas_portao')
                    .select('*');

                if (error) throw error;
                if (!itens) return;

                let tSorter = 0, tCarregamento = 0, tFaltas = 0, tRequisitadas = 0, tFaltasNoApp = 0;
                const datasMap = {};

                itens.forEach(item => {
                    const dt = item.data_operacao || 'Sem Data';
                    if (!datasMap[dt]) {
                        datasMap[dt] = { sorter: 0, carregamento: 0, faltas: 0, requisitadas: 0, app: 0 };
                    }

                    const kind = item.kind || 'falta';
                    const obs = String(item.observacao || '').toLowerCase();
                    const req = String(item.requisitada || '').trim().toLowerCase();
                    const app = String(item.no_app || '').trim().toLowerCase();

                    if (kind === 'rasgada' || obs.includes('rasgada')) {
                        if (obs.includes('sorter')) datasMap[dt].sorter++;
                        else datasMap[dt].carregamento++;
                    } else {
                        datasMap[dt].faltas++;
                    }

                    if (req === 'sim' || req === 'true' || req === '1' || req === 's') {
                        datasMap[dt].requisitadas++;
                        tRequisitadas++;
                    }

                    if (app === 'sim' || app === 'true' || app === '1' || app === 's') {
                        datasMap[dt].app++;
                        tFaltasNoApp++;
                    }
                });

                // Soma os totais gerais
                Object.values(datasMap.forEach(d => {
                    tSorter += d.sorter;
                    tCarregamento += d.carregamento;
                    tFaltas += d.faltas;
                });

                // Atualiza os KPIs na tela
                document.getElementById('kpi-sorter').innerText = tSorter;
                document.getElementById('kpi-carregamento-rasgadas').innerText = tCarregamento;
                document.getElementById('kpi-faltas').innerText = tFaltas;
                document.getElementById('kpi-requisitadas').innerText = tRequisitadas;
                document.getElementById('kpi-faltas-no-app').innerText = tFaltasNoApp;
                document.getElementById('kpi-total').innerText = tSorter + tCarregamento + tFaltas + tRequisitadas;

            } catch (err) {
                console.error("Erro ao buscar dados do Supabase:", err);
            }
        }

        window.onload = function() {
            carregarDadosDiretos();
        };
    </script>
</body>
</html>
